[project]
name = "claude-business-skills"
version = "1.0.0"
description = "Claude set up for a service agency: Skills, Project pack, read-only data connector, review app and evals (demo build on sample data)."
requires-python = ">=3.11"

[tool.setuptools]
packages = ["agency", "connector", "studio", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
