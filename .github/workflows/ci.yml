name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      DEMO_MODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libraries for PDF export
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
      - name: Install pinned dependencies (hash-checked)
        run: pip install --require-hashes -r requirements.lock
      - name: Tests
        run: python -m pytest
      - name: Evals
        run: python -m evals.run_evals
